workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Initialize clean Flutter project structure
        script: |
          # Supprime les anciens fichiers racine et recrée un projet propre et aux normes
          rm -rf android ios linux macos windows web
          flutter create . --org com.securiteimei --project-name securite_imei_app --platforms=android
          
          # Ajout du fichier de configuration device_admin.xml requis pour l'antivol
          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/device_admin.xml
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <force-lock />
              </uses-policies>
          </device-admin>
          EOF
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

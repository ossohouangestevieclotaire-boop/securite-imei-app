# 3. Création de MainActivity.kt corrigée pour lancer l'administrateur
          cat << 'EOF' > android/app/src/main/kotlin/com/securiteimei/securite_imei_app/MainActivity.kt
          package com.securiteimei.securite_imei_app

          import android.app.admin.DevicePolicyManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import androidx.annotation.NonNull
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "securite.imei.app/admin"

              override fun configureFlutterEngine(@NonNull flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      val dpm = getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                      val compName = ComponentName(this, DeviceAdminReceiver::class.java)

                      when (call.method) {
                          "isAdminActive" -> {
                              result.success(dpm.isAdminActive(compName))
                          }
                          "requestAdmin" -> {
                              try {
                                  val intent = Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN).apply {
                                      putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, compName)
                                      putExtra(DevicePolicyManager.EXTRA_ADD_EXPLANATION, "Activation requise pour la protection antivol.")
                                  }
                                  startActivity(intent)
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.error("ERROR", e.message, null)
                              }
                          }
                          "lockDevice" -> {
                              if (dpm.isAdminActive(compName)) {
                                  dpm.lockNow()
                                  result.success(true)
                              } else {
                                  result.error("UNAUTHORIZED", "Admin not active", null)
                              }
                          }
                          else -> {
                              result.notImplemented()
                          }
                      }
                  }
              }
          }
          EOF
